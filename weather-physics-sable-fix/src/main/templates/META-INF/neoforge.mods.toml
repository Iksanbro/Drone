modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/iksanbro/drone/issues"

[[mixins]]
config = "wpfix.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Fixes the server crash "java.lang.RuntimeException: Body has been removed" of Weather Physics
(tornadophysics) with Sable: a sub-level whose physics body was removed is skipped for that tick.
Does nothing without Weather Physics.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tornadophysics"
type = "optional"
versionRange = "[1.0.3,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sable"
type = "optional"
versionRange = "[2.0.0,)"
ordering = "NONE"
side = "BOTH"
