plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "cbc-parts-assembly-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content { includeGroup 'com.simibubi.create' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { name = 'CurseMaven'; url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

// Data files are produced by tools/generate_data.py
sourceSets.main.resources.srcDir 'src/generated/resources'
// Medium cannon shells (properties, models, lang, recipes), produced by tools/generate_medium_shells.py
sourceSets.main.resources.srcDir 'src/generated/medium_shells'
// Addon loot tables and block tags moved to the 1.21 paths, produced by tools/convert_addon_data.py
sourceSets.main.resources.srcDir 'src/generated/addon_fixes'

// In-game tests (./gradlew runGameTestServer). Not part of the released jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    // Mods that are only put on the classpath of dev runs, never into the published metadata
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeClasspath.extendsFrom localRuntime
    createJar
}

neoForge {
    version = neo_version
    addModdingDependenciesTo(sourceSets.gametest)

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // the client with a self test (medium shells: creative tab, item models, rounds in flight;
        // screenshots in run/screenshots); use under Xvfb
        clientTest {
            client()
            sourceSet = sourceSets.gametest
            systemProperty 'cbcparts.clientTest', 'true'
            programArguments.addAll('--width', '1280', '--height', '720')
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

// Create ships Ponder (with Catnip), Flywheel and Registrate inside its jar; compile against those copies
def createLibs = layout.buildDirectory.dir('createLibs')
def extractCreateLibs = tasks.register('extractCreateLibs', Copy) {
    from({ zipTree(configurations.createJar.singleFile).matching { include 'META-INF/jarjar/*.jar' } })
    into createLibs
    eachFile { path = name }
    includeEmptyDirs = false
}
tasks.named('compileJava') { dependsOn extractCreateLibs }
tasks.named('compileGametestJava') { dependsOn extractCreateLibs }

dependencies {
    compileOnly("com.simibubi.create:create-1.21.1:${create_version}:slim") { transitive = false }
    createJar("maven.modrinth:create:${create_modrinth}") { transitive = false }
    compileOnly fileTree(createLibs) { include '*.jar' }

    // Medium cannon shells extend the projectiles and rounds of CBC Neo Warfare. That code is only
    // loaded when Neo Warfare is installed.
    compileOnly "maven.modrinth:create-big-cannons:${cbc_modrinth}"
    compileOnly "maven.modrinth:rpl:${rpl_modrinth}"
    compileOnly "curse.maven:cbc-neo-warfare-1552960:${neo_warfare_curse_file}"

    localRuntime "maven.modrinth:create:${create_modrinth}"
    localRuntime "maven.modrinth:rpl:${rpl_modrinth}"
    localRuntime "maven.modrinth:create-big-cannons:${cbc_modrinth}"
    // Run with -PwithEnhancedShells to test with CBC Enchanced Shells 1.5.1 (rockets in unloaded chunks,
    // Mk medium shells); -PenhancedShellsFile=8838000 for 1.2.5
    if (project.hasProperty('withEnhancedShells')) {
        localRuntime "curse.maven:cbc-enchanced-shells-1489732:${project.findProperty('enhancedShellsFile') ?: '9336668'}"
    }

    // Run with -PwithoutAddons to test the mod with Create Big Cannons alone
    if (!project.hasProperty('withoutAddons')) {
        localRuntime "maven.modrinth:create-big-cannons-advanced-technologies:${cbcat_modrinth}"
        localRuntime "curse.maven:cbc-neo-warfare-1552960:${neo_warfare_curse_file}"
        // -PwithoutCbcmwFix: Neo Warfare without CBCMW recipe fix (medium cannon recipes must disappear)
        if (!project.hasProperty('withoutCbcmwFix')) {
            localRuntime "curse.maven:cbcmw-recipe-fix-1598498:${cbcmw_fix_curse_file}"
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
